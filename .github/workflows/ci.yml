name: ci
# Fast stage needs no simulator. Simulator stage: build, snapshots, accessibility audit, journeys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}          # per workflow and branch; jobs of different branches run in parallel on every runner
  cancel-in-progress: false
permissions:
  contents: read
env:
  XCODE_PATH: /Applications/Xcode.app
  XCODE_VERSION: "27.2"
  SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
jobs:
  fast:
    # Never run code from a fork on the Mac.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build folder for this runner
        run: |
          echo "CI_BUILD_ROOT=$HOME/ci-build/$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CONTRACT_GEN_BUILD=$HOME/ci-build/$RUNNER_NAME/contract-gen" >> "$GITHUB_ENV"
      - name: Toolchain (pinned)
        run: tools/ci-preflight.sh
      - name: Clean build output
        run: tools/ci-clean.sh
      - name: Tool self-test
        run: tools/selftest.sh
      - name: Structure lint
        run: tools/lint-structure.sh
      - name: Token lint
        run: tools/lint-tokens.sh
      - name: Flows tests
        run: swift test --package-path app/Packages/Flows --scratch-path "$CI_BUILD_ROOT/spm-flows"
      - name: DesignKit tests
        run: swift test --package-path app/Packages/DesignKit --scratch-path "$CI_BUILD_ROOT/spm-designkit"
      - name: Server tests
        working-directory: next
        run: deno task test
      - name: Contract validation
        run: app/Packages/Contract/generate.sh --check
  simulator:
    needs: fast
    runs-on: [self-hosted]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build folder for this runner
        run: |
          echo "CI_BUILD_ROOT=$HOME/ci-build/$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CONTRACT_GEN_BUILD=$HOME/ci-build/$RUNNER_NAME/contract-gen" >> "$GITHUB_ENV"
      - name: Toolchain (pinned)
        run: tools/ci-preflight.sh
      - name: Clean build output
        run: tools/ci-clean.sh
      - name: Boot simulator and grant journey permissions
        id: sim
        run: echo "udid=$(tools/ci-sim.sh)" >> "$GITHUB_OUTPUT"
      - name: Build, snapshot tests, accessibility audit, journeys
        run: |
          xcodebuild test -project app/Presence.xcodeproj -scheme Presence \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$CI_BUILD_ROOT/dd" -resultBundlePath "$CI_BUILD_ROOT/test.xcresult" \
            -retry-tests-on-failure -test-iterations 2   # TESTING.md flake policy: a failed test runs once more; two failures are red
      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ env.CI_BUILD_ROOT }}/test.xcresult
          retention-days: 7
      - name: Delete simulator
        if: always() && steps.sim.outputs.udid != ''
        run: xcrun simctl delete "${{ steps.sim.outputs.udid }}"
