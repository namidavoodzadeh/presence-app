name: build-item
# An issue labelled `ready` (by the owner) starts one Claude Code session on the Mac. The change goes up as a PR.
# Round 1 red (CI failed, or risk-review requested changes): a second session gets the failure log or review text.
# Round 2 red: the issue is labelled `returned` and stops. A commit red on both CI and risk-review is one round.
on:
  issues:
    types: [labeled]
  workflow_run:
    workflows: [ci, merge]
    types: [completed]
concurrency:
  group: build-item-${{ github.event.issue.number || github.event.workflow_run.head_branch }}   # one session per item; the one runner runs one job at a time
  cancel-in-progress: false
permissions:
  contents: read
env:
  XCODE_PATH: /Applications/Xcode.app
  XCODE_VERSION: "27.2"
  SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  CI_BUILD_ROOT: /Users/nami/ci-build/ci
  GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}          # pushes and PRs must trigger ci.yml, which GITHUB_TOKEN cannot
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
jobs:
  start:
    if: >-
      github.event_name == 'issues' && github.event.label.name == 'ready' &&
      github.event.sender.login == github.repository_owner
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FACTORY_TOKEN }}
      - name: Toolchain (pinned)
        run: tools/ci-preflight.sh
      - name: Clean build output
        run: tools/ci-clean.sh
      - name: Builder session, round 1
        run: |
          n=${{ github.event.issue.number }}
          git checkout -B "item/$n"
          # Labels like path:contract/ allow that protected path for this session only.
          PROTECT_ALLOW="$(gh issue view "$n" --json labels --jq '[.labels[].name | select(startswith("path:")) | ltrimstr("path:")] | join(":")')"
          export PROTECT_ALLOW
          tools/item-prompt.sh "$n" 1 > "$CI_BUILD_ROOT/prompt.md"
          claude -p "$(cat "$CI_BUILD_ROOT/prompt.md")" --permission-mode acceptEdits \
            --allowedTools "Bash Edit Write Read Glob Grep" --max-turns 200
      - name: Open the change
        run: tools/item-publish.sh ${{ github.event.issue.number }} 1
  round:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'item/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FACTORY_TOKEN }}
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: Toolchain (pinned)
        run: tools/ci-preflight.sh
      - name: Clean build output
        run: tools/ci-clean.sh
      - name: Count red rounds
        id: count
        run: |
          branch="${{ github.event.workflow_run.head_branch }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "n=${branch#item/}" >> "$GITHUB_OUTPUT"
          # A failed merge run is a red round only when risk-review requested changes; a review that could not run
          # (Codex signed out, timeout) leaves the change waiting for a re-run of risk-review.
          if ! tools/item-reds.sh is-red ${{ github.event.workflow_run.id }}; then
            echo "reds=0" >> "$GITHUB_OUTPUT"; echo "run ${{ github.event.workflow_run.id }} is not a red round"; exit 0
          fi
          # A newer commit is already on the branch (the other check on the same commit started the next round).
          if [ "$(git rev-parse HEAD)" != "$sha" ]; then
            echo "reds=0" >> "$GITHUB_OUTPUT"; echo "stale: $sha is no longer the head of $branch"; exit 0
          fi
          reds=$(tools/item-reds.sh count "$branch")
          echo "reds=$reds" >> "$GITHUB_OUTPUT"; echo "red rounds: $reds"
      - name: Second red, return the issue
        if: steps.count.outputs.reds >= 2
        run: |
          n=${{ steps.count.outputs.n }}
          gh issue edit "$n" --add-label returned --remove-label ready
          gh issue comment "$n" --body "Returned after two red rounds (${{ github.event.workflow_run.html_url }}). Treat as a package defect: say what the package or the item got wrong."
          gh pr close "item/$n" --comment "Stopped: second red round. See issue #$n."
      - name: Builder session, round 2
        if: steps.count.outputs.reds == 1
        run: |
          n=${{ steps.count.outputs.n }}
          tools/item-reds.sh log "${{ github.event.workflow_run.head_branch }}" "${{ github.event.workflow_run.head_sha }}" \
            "$CI_BUILD_ROOT/failed.log" || true
          PROTECT_ALLOW="$(gh issue view "$n" --json labels --jq '[.labels[].name | select(startswith("path:")) | ltrimstr("path:")] | join(":")')"
          export PROTECT_ALLOW
          tools/item-prompt.sh "$n" 2 "$CI_BUILD_ROOT/failed.log" > "$CI_BUILD_ROOT/prompt.md"
          claude -p "$(cat "$CI_BUILD_ROOT/prompt.md")" --permission-mode acceptEdits \
            --allowedTools "Bash Edit Write Read Glob Grep" --max-turns 200
          tools/item-publish.sh "$n" 2
