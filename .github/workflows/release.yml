name: release
# A merge to main that touches app/ is archived and uploaded to TestFlight (internal group "Owner").
on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
env:
  XCODE_PATH: /Applications/Xcode.app
  XCODE_VERSION: "27.2"
  SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  CI_BUILD_ROOT: /Users/nami/ci-build/ci
  CONTRACT_GEN_BUILD: /Users/nami/ci-build/ci/contract-gen
jobs:
  testflight:
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned)
        run: tools/ci-preflight.sh
      - name: Clean build output
        run: tools/ci-clean.sh
      - name: App Store Connect key present
        env:
          ASC_KEY_PATH: ${{ vars.ASC_KEY_PATH }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          [ -n "$ASC_KEY_PATH" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] \
            || { echo "::error::Set repository variables ASC_KEY_PATH, ASC_KEY_ID, ASC_ISSUER_ID."; exit 3; }
          [ -r "$ASC_KEY_PATH" ] || { echo "::error::App Store Connect key not readable at ASC_KEY_PATH on this Mac."; exit 3; }
      - name: Contract client up to date
        run: app/Packages/Contract/generate.sh --check
      - name: Unlock CI signing keychain
        env:
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          # The runner is a launchd agent and cannot use the login keychain; sign from a dedicated one.
          keychain="$HOME/Library/Keychains/ci-signing.keychain-db"
          [ -n "$CI_KEYCHAIN_PASSWORD" ] || { echo "::error::Set repository secret CI_KEYCHAIN_PASSWORD."; exit 3; }
          [ -f "$keychain" ] || { echo "::error::CI signing keychain missing at $keychain on this Mac."; exit 3; }
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$keychain"
          # The owner put this keychain first in the user search list once, at setup; export finds the identity there.
          security list-keychains -d user | grep -q '/ci-signing.keychain-db"' || { echo "::error::ci-signing keychain is not in the user search list on this Mac."; exit 3; }
      - name: Archive
        env:
          ASC_KEY_PATH: ${{ vars.ASC_KEY_PATH }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          # The server the build talks to (#108); app/Config/Release.xcconfig leaves both empty on purpose.
          PRESENCE_API_BASE: ${{ vars.PRESENCE_API_BASE }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          [ -n "$PRESENCE_API_BASE" ] && [ -n "$SUPABASE_ANON_KEY" ] \
            || { echo "::error::Set repository variables PRESENCE_API_BASE and SUPABASE_ANON_KEY."; exit 3; }
          case "$PRESENCE_API_BASE" in https://*) ;; *) echo "::error::PRESENCE_API_BASE must be an https URL."; exit 3;; esac
          # Only a public client key may ship in the app: never a secret or service-role key (never printed).
          case "$SUPABASE_ANON_KEY" in sb_secret_*) echo "::error::SUPABASE_ANON_KEY is a secret key; use the anon/publishable key."; exit 3;; esac
          role=$(printf '%s' "$SUPABASE_ANON_KEY" | python3 -I -c 'import sys,json,base64; p=(sys.stdin.read().strip().split(".")+["",""])[1]; print(json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4)) or b"{}").get("role","") if p else "")' 2>/dev/null || true)
          [ "$role" = service_role ] && { echo "::error::SUPABASE_ANON_KEY is a service-role key; use the anon key."; exit 3; }
          # Old app reached build 55 under the same bundle id; stay above it.
          build=$(( ${{ github.run_number }} + 100 ))
          xcodebuild archive -project app/Presence.xcodeproj -scheme Presence -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$CI_BUILD_ROOT/Presence.xcarchive" \
            -derivedDataPath "$CI_BUILD_ROOT/dd" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain=$HOME/Library/Keychains/ci-signing.keychain-db" \
            CURRENT_PROJECT_VERSION="$build" PRESENCE_API_BASE="$PRESENCE_API_BASE" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: App Store provisioning profile
        id: profile
        env:
          ASC_KEY_PATH: ${{ vars.ASC_KEY_PATH }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          # The API key cannot use cloud-managed certificates; sign manually with the local distribution identity
          # and an App Store profile that includes it. Prints only uuid= and sha1= lines.
          python3 -I tools/release-profile.py --bundle-id com.namidavoodzadeh.presence \
            --keychain "$HOME/Library/Keychains/ci-signing.keychain-db" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ vars.ASC_KEY_PATH }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
          SIGNING_SHA1: ${{ steps.profile.outputs.sha1 }}
        run: |
          [ -n "$PROFILE_UUID" ] && [ -n "$SIGNING_SHA1" ] || { echo "::error::No provisioning profile from the previous step."; exit 3; }
          cat > "$CI_BUILD_ROOT/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>UK39PYVJ96</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGNING_SHA1</string>
            <key>provisioningProfiles</key><dict>
              <key>com.namidavoodzadeh.presence</key><string>$PROFILE_UUID</string>
            </dict>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$CI_BUILD_ROOT/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$CI_BUILD_ROOT/Presence.xcarchive" \
            -exportOptionsPlist "$CI_BUILD_ROOT/ExportOptions.plist" -exportPath "$CI_BUILD_ROOT/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain=$HOME/Library/Keychains/ci-signing.keychain-db"
      - name: Lock CI signing keychain
        if: always()
        run: security lock-keychain "$HOME/Library/Keychains/ci-signing.keychain-db"
