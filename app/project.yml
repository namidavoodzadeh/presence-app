# Source of Presence.xcodeproj. Regenerate with: cd app && xcodegen generate
name: Presence
options:
  bundleIdPrefix: com.namidavoodzadeh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Flows:
    path: Packages/Flows
  Contract:
    path: Packages/Contract
  DesignKit:
    path: Packages/DesignKit
settings:
  base:
    DEVELOPMENT_TEAM: UK39PYVJ96
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.9"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Presence:
    type: application
    platform: iOS
    sources:
      - path: App
        type: syncedFolder
    dependencies:
      - package: Flows
      - package: Contract
      - package: DesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namidavoodzadeh.presence
        PRODUCT_NAME: Presence
        INFOPLIST_KEY_CFBundleDisplayName: Kenember
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Presence:
    build:
      targets:
        Presence: all
