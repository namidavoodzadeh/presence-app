# Source of Presence.xcodeproj. Regenerate with: cd app && xcodegen generate
name: Presence
options:
  bundleIdPrefix: com.namidavoodzadeh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# TestFlight is a Release build with the tester Report button (#61). App Store builds use Release, which never has it.
configs:
  Debug: debug
  TestFlight: release
  Release: release
packages:
  Flows:
    path: Packages/Flows
  Contract:
    path: Packages/Contract
  DesignKit:
    path: Packages/DesignKit
settings:
  base:
    DEVELOPMENT_TEAM: UK39PYVJ96
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.9"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Presence:
    type: application
    platform: iOS
    sources:
      - path: App
        type: syncedFolder
    dependencies:
      - package: Flows
      - package: Contract
      - package: DesignKit
    # The API base and anon key (#108): Debug carries a fixture; TestFlight and Release carry the hosted base, and
    # release.yml passes the anon key.
    configFiles:
      Debug: Config/Debug.xcconfig
      TestFlight: Config/Release.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namidavoodzadeh.presence
        INFOPLIST_FILE: Config/Info.plist
        # Sign in with Apple (#128).
        CODE_SIGN_ENTITLEMENTS: Config/Presence.entitlements
        PRODUCT_NAME: Presence
        INFOPLIST_KEY_CFBundleDisplayName: Kenember
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Declared Age Range is iOS 26 and later; the app runs from iOS 17, so the framework is linked weakly (#128).
        OTHER_LDFLAGS: "$(inherited) -weak_framework DeclaredAgeRange"
      configs:
        Debug: &testerReport
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TESTER_REPORT"
          INFOPLIST_KEY_NSMicrophoneUsageDescription: "Tester reports: hold the red button and say what you saw. Your voice stays on this iPhone."
          INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Tester reports: what you say is turned into text on this iPhone."
        TestFlight: *testerReport
  PresenceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Snapshots
        excludes: ["__Snapshots__/**"]
    dependencies:
      - target: Presence
      - package: Flows
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namidavoodzadeh.presence.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Presence.app/Presence"
        BUNDLE_LOADER: "$(TEST_HOST)"
  PresenceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
        excludes: ["permissions.txt"]
    dependencies:
      - target: Presence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namidavoodzadeh.presence.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Presence
schemes:
  Presence:
    build:
      targets:
        Presence: all
    test:
      targets:
        - PresenceTests
        - PresenceUITests
      gatherCoverageData: false
    archive:
      config: TestFlight
